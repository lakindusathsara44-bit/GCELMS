// Randomize the position of the correct option so it is not always option A.
Object.values(banks).forEach(bank=>bank.items.forEach(item=>{
  const correctAnswer=item[1][item[2]];
  for(let i=item[1].length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[item[1][i],item[1][j]]=[item[1][j],item[1][i]];}
  item[2]=item[1].indexOf(correctAnswer);
}));
const subject=new URLSearchParams(location.search).get("subject")||"";
const bank=banks[subject];
if(!bank){document.getElementById("title").textContent="MCQ set unavailable";document.getElementById("quiz").innerHTML="<p>This subject does not currently have a verified MCQ set.</p>";}
else{
document.documentElement.lang=bank.lang==="தமிழ்"?"ta":"si";
document.getElementById("title").textContent=subject+" — MCQ Practice";
document.getElementById("description").textContent="40 questions · 3 choices · 1 correct answer · "+bank.lang+". Select one answer using the radio buttons. Your full result and answer review will appear at the end.";
document.getElementById("language").textContent=bank.lang.toUpperCase();
let index=0,answers=Array(40).fill(null),locked=false;
const $=id=>document.getElementById(id);
function render(){const item=bank.items[index];$("qnumber").textContent="QUESTION "+String(index+1).padStart(2,"0");$("counter").textContent="QUESTION "+(index+1)+" / 40";$("answered").textContent=answers.filter(x=>x!==null).length+" ANSWERED";$("bar").style.width=(answers.filter(x=>x!==null).length/40*100)+"%";$("qtext").textContent=item[0];$("options").innerHTML="";item[1].forEach((option,k)=>{const label=document.createElement("label");label.className="option";label.innerHTML='<input type="radio" name="answer" value="'+k+'" '+(answers[index]===k?"checked":"")+'><span></span>';label.querySelector("span").textContent=option;label.querySelector("input").addEventListener("change",()=>{answers[index]=k;renderFeedback();$("answered").textContent=answers.filter(x=>x!==null).length+" ANSWERED";$("bar").style.width=(answers.filter(x=>x!==null).length/40*100)+"%";});$("options").appendChild(label);});$("prev").disabled=index===0;$("next").textContent=index===39?"Finish test":"Next →";renderFeedback();}
function renderFeedback(){const item=bank.items[index],chosen=answers[index];$("feedback").textContent=chosen===null?"":chosen===item[2]?"✓ Correct answer":"✕ Incorrect. Correct answer: "+item[1][item[2]];$("feedback").style.color=chosen===null?"":chosen===item[2]?"#73e0ad":"#ff9a9a";document.querySelectorAll(".option").forEach((el,k)=>{el.classList.toggle("correct",chosen!==null&&k===item[2]);el.classList.toggle("wrong",chosen===k&&chosen!==item[2]);});}
$("prev").onclick=()=>{if(index>0){index--;render();}};$("next").onclick=()=>{if(index<39){index++;render();}else showResult();};
function showResult(){const correct=answers.reduce((n,a,i)=>n+(a===bank.items[i][2]?1:0),0),wrong=answers.filter((a,i)=>a!==null&&a!==bank.items[i][2]).length,unanswered=40-answers.filter(a=>a!==null).length;$("quiz").style.display="none";$("result").style.display="block";$("score").textContent=correct+" / 40";$("correctCount").textContent=correct;$("wrongCount").textContent=wrong;$("unansweredCount").textContent=unanswered;$("remark").textContent=correct>=35?"Excellent work!":correct>=25?"Good effort. Review the incorrect answers and try again.": "Keep practising. Read the answer review and attempt the test again.";$("reviewList").innerHTML=bank.items.map((q,i)=>'<div class="review-item"><b>'+(i+1)+". "+q[0]+'</b><span class="muted">Your answer: '+(answers[i]===null?"Not answered":q[1][answers[i]])+' · Correct: '+q[1][q[2]]+'</span> <strong style="color:'+(answers[i]===q[2]?"#73e0ad":"#ff9a9a")+'">'+(answers[i]===q[2]?"✓ Correct":"✕ Incorrect")+'</strong></div>').join("");}
$("retry").onclick=()=>{index=0;answers=Array(40).fill(null);$("quiz").style.display="block";$("result").style.display="none";render();};render();
}
